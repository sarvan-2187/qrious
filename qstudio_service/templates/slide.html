<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Geist Sans";
    src: url("{{ font_base }}/geist-sans-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Geist Sans";
    src: url("{{ font_base }}/geist-sans-latin-600-normal.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    background: #000000;
    color: #fafafa;
    font-family: "Geist Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  .slide {
    width: 1920px;
    height: 1080px;
    padding: 96px 120px;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(circle at 15% 10%, rgba(139, 0, 255, 0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(52, 211, 153, 0.10), transparent 40%),
      #000000;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 56px;
  }

  .brand-dot {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    background: #8b00ff;
    box-shadow: 0 0 24px 4px rgba(139, 0, 255, 0.65);
  }

  .brand-text {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(250, 250, 250, 0.6);
    text-transform: uppercase;
  }

  .title {
    font-size: 64px;
    font-weight: 600;
    line-height: 1.15;
    max-width: 1500px;
    margin-bottom: 64px;
  }

  .card {
    flex: 1;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.03);
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
  }

  .bullet {
    display: flex;
    align-items: flex-start;
    gap: 28px;
    font-size: 38px;
    line-height: 1.4;
    font-weight: 400;
    color: #f4f4f5;
  }

  .bullet-marker {
    flex: none;
    width: 14px;
    height: 14px;
    margin-top: 14px;
    border-radius: 999px;
    background: #34d399;
    box-shadow: 0 0 16px 2px rgba(52, 211, 153, 0.55);
  }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 120px;
    right: 120px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgba(250, 250, 250, 0.4);
    font-size: 22px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-text">Qrious &middot; AI Video Overview</div>
    </div>

    <div class="title">{{ title }}</div>

    <div class="card">
      {% for bullet in bullets %}
      <div class="bullet">
        <div class="bullet-marker"></div>
        <div>{{ bullet }}</div>
      </div>
      {% endfor %}
    </div>

    <div class="footer">
      <span>Generated overview</span>
      <span>{{ slide_number }} / {{ total_slides }}</span>
    </div>
  </div>
</body>
</html>
